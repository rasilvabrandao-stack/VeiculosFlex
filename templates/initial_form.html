<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saída de Carro</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px #0002;
    }

    label {
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #004c99;
    }

    .photo-section {
      margin-bottom: 20px;
    }

    .photo-section img {
      width: 100%;
      display: none;
      margin-top: 10px;
      border-radius: 8px;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
    }

    .photo-buttons button {
      flex: 1;
      padding: 8px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>Saída do Carro</h1>

  <div class="container">
    <form id="initialForm">

      <label for="departure_time">Data e Hora da Saída:</label>
      <input type="text" id="departure_time" name="departure_time" readonly>

      <label for="Autorizador">Autorizador:</label>
      <select id="Autorizador" name="Autorizador">
        <option>Selecione</option>
        <option>Direção</option>
        <option>Osmarina</option>
        <option>Elessandra</option>
        <option>Patrícia</option>
      </select>

      <!-- FOTO DO PAINEL -->
      <div class="photo-section">
        <label>Painel (Hodômetro):</label>
        <div class="photo-buttons">
          <button type="button" onclick="document.getElementById('initial_tank_file').click()">Tirar Foto</button>
        </div>
        <input type="file" id="initial_tank_file" name="initial_tank_photo" accept="image/*" capture="environment" style="display:none;">
        <img id="initial_tank_preview" alt="Preview do Painel">
      </div>

      <!-- FOTO DO ESTADO DO CARRO -->
      <div class="photo-section">
        <label>Estado do Carro:</label>
        <div class="photo-buttons">
          <button type="button" onclick="document.getElementById('car_status_file').click()">Tirar Foto</button>
        </div>
        <input type="file" id="car_status_file" name="car_status_photo" accept="image/*" capture="environment" style="display:none;">
        <img id="car_status_preview" alt="Preview do Carro">
      </div>

      <label for="observations">Observações:</label>
      <textarea id="observations" name="observations" rows="4"></textarea>

      <button type="submit">Salvar Saída</button>
    </form>
  </div>

  <script>
    // Preenche data e hora automaticamente
    document.addEventListener('DOMContentLoaded', function () {
      const now = new Date();
      const dateTimeString = now.toLocaleString('pt-BR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      const dt = document.getElementById('departure_time');
      if (dt) dt.value = dateTimeString;
    });

    // Preview das fotos
    document.getElementById('initial_tank_file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('initial_tank_preview').src = URL.createObjectURL(file);
        document.getElementById('initial_tank_preview').style.display = 'block';
      }
    });

    document.getElementById('car_status_file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('car_status_preview').src = URL.createObjectURL(file);
        document.getElementById('car_status_preview').style.display = 'block';
      }
    });

    // Validação + envio
    document.getElementById('initialForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Validar autorizador
      const autorizador = document.getElementById('Autorizador').value;
      if (autorizador === "Selecione") {
        alert("Por favor, selecione um autorizador.");
        return;
      }

      // Validar fotos
      if (document.getElementById('initial_tank_file').files.length === 0) {
        alert("Por favor, tire a foto do Painel.");
        return;
      }

      if (document.getElementById('car_status_file').files.length === 0) {
        alert("Por favor, tire a foto do Estado do Carro.");
        return;
      }

      // Envio final
      const formData = new FormData(e.target);

      fetch('/submit_initial', {
        method: 'POST',
        body: formData,
      })
      .then(r => r.json())
      .then(data => {
        if (data.status === "ok") {
          alert("Salvo com sucesso!");
          window.location.href = "/";
        } else {
          alert("Erro ao salvar.");
        }
      });
    });
  </script>

</body>
</html>
