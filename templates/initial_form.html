<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Carro - Saída</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 550px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
      margin: 20px auto;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 1.6rem;
      margin-bottom: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .photo-section {
      display: flex;
      flex-direction: column;
      margin-top: 10px;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .photo-buttons button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .photo-buttons button:hover {
      background-color: #0056b3;
    }

    .photo-preview {
      margin-top: 10px;
      max-width: 200px;
      max-height: 150px;
      border: 1px solid #ccc;
      display: none;
    }

    label {
      margin-top: 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    textarea {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      resize: vertical;
    }

    button {
      margin-top: 25px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    .alerta {
      font-weight: bold;
      margin-top: 25px;
      color: red;
      font-size: 0.95rem;
      text-align: center;
    }

    .meu-paragrafo {
      color: #000;
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
      margin-top: 5px;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .container {
        padding: 15px;
        border-radius: 10px;
      }

      h1 {
        font-size: 1.4rem;
      }

      label {
        font-size: 0.9rem;
      }

      input {
        font-size: 0.9rem;
        padding: 9px;
      }

      button {
        font-size: 0.95rem;
        padding: 10px;
      }
    }
/* Remove o estilo nativo dos inputs de data e hora */
input[type="date"],
input[type="time"] {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-color: white;
  color: #000;
}

/* Mantém o estilo igual aos outros inputs */
input[type="date"]:focus,
input[type="time"]:focus {
  outline: none;
  border-color: #4CAF50;
  box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
}

    #Autorizador
  {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 0.95rem;
      }
  #textodaora
  {
    text-align: center;
      font-size: 2rem;
  }

  /* Custom Checkbox Styles for Radio Buttons */
  .radio-group {
    margin-top: 10px;
  }

  .radio-label {
    display: block;
    position: relative;
    padding-left: 35px;
    margin-bottom: 12px;
    cursor: pointer;
    font-size: 0.95rem;
    user-select: none;
  }

  .radio-label input {
    position: absolute;
    opacity: 0;
    cursor: pointer;
    height: 0;
    width: 0;
  }

  .checkmark {
    position: absolute;
    top: 0;
    left: 0;
    height: 25px;
    width: 25px;
    background-color: #eee;
    border-radius: 4px;
    transition: background-color 0.3s;
  }

  .radio-label:hover input ~ .checkmark {
    background-color: #ccc;
  }

  .radio-label input:checked ~ .checkmark {
    background-color: #4CAF50;
  }

  .checkmark:after {
    content: "";
    position: absolute;
    display: none;
  }

  .radio-label input:checked ~ .checkmark:after {
    display: block;
  }

  .radio-label .checkmark:after {
    left: 9px;
    top: 5px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 3px 3px 0;
    transform: rotate(45deg);
  }
  </style>
</head>
<body>
  <div class="container">
    <h1>Controle de Carro - Saída</h1>
    <form id="initialForm" enctype="multipart/form-data">
      <input type="hidden" id="cpf" name="cpf" value="{{ cpf }}">

      <label for="requester_name">Nome do Autorizador:</label>
      <select id="Autorizador" name="requester_name">
        <Option> Selecione </Option>
        <Option> Iseli </Option>
        <Option> Elis </Option>
        <Option> Will </Option>
        <Option> William </Option>
        <Option> Ronaldo </Option>
        <Option> Gustavo </Option>
        <Option> Jesus </Option>
        <Option> Bruno </Option>
        <Option> Ivan </Option>
        <Option> Thiago Coelho </Option>
      </select>


      <label for="reason">Motivo:</label>
      <input type="text" id="reason" name="reason" required>

      <label for="driver_name">Nome do Motorista:</label>
      <input type="text" id="driver_name" name="driver_name" value="{{ driver_name }}" required>

      <label for="departure_time">Data e Horário de Saída:</label>
      <input type="text" id="departure_time" name="departure_time" value="{{ current_time }}" readonly>

      <label for="initial_km">Km Inicial:</label>
      <input type="number" id="initial_km" name="initial_km" required>

      <label for="initial_tank_level">Autonomia do tanque de gasolina:</label>
      <input type="number" id="initial_tank_level" name="initial_tank_level" min="0" max="100" required>

            <div class="photo-section">
        <label>Foto do Painel/Hodômetro:</label>
        <div class="photo-buttons">
          <button type="button" onclick="takePhoto('initial_tank')">Tirar Foto</button>
          <input type="file" id="initial_tank_file" name="initial_tank_photo" accept="image/*" style="display: none;">
        </div>
        <img id="initial_tank_preview" class="photo-preview" alt="Preview">
      </div>

     <label for="origin">Endereço de Origem:</label>
      <input type="text" id="origin" name="origin" required>

     <label for="car_status">Estado do Carro:</label>
      <input type="text" id="car_status" name="car_status" required>

      <label for="destination">Endereço de Destino:</label>
      <input type="text" id="destination" name="destination" required>

      <div class="photo-section">
        <label>Foto do Estado do Carro:</label>
        <div class="photo-buttons">
          <button type="button" onclick="takePhoto('car_status')">Tirar Foto</button>
          <input type="file" id="car_status_file" name="car_status_photo" accept="image/*" style="display: none;">
        </div>
        <img id="car_status_preview" class="photo-preview" alt="Preview">
      </div>
      <div class="radio-group">
    <p id="textodaora"><strong>Estado do veículo</strong></p>

    <div style="margin-bottom: 15px;">
      <strong>O Veículo está sujo?</strong><br>
      <label class="radio-label">Sim
        <input type="radio" name="vehicle_dirty" value="Sim">
        <span class="checkmark"></span>
      </label>
      <label class="radio-label">Não
        <input type="radio" name="vehicle_dirty" value="Não">
        <span class="checkmark"></span>
      </label>
    </div>

    <div style="margin-bottom: 15px;">
      <strong>Quebrou alguma peça?</strong><br>
      <label class="radio-label">Sim
        <input type="radio" name="vehicle_broken" value="Sim">
        <span class="checkmark"></span>
      </label>
      <label class="radio-label">Não
        <input type="radio" name="vehicle_broken" value="Não">
        <span class="checkmark"></span>
      </label>
    </div>

    <div style="margin-bottom: 15px;">
      <strong>Houve danificações?</strong><br>
      <label class="radio-label">Sim
        <input type="radio" name="vehicle_damaged" value="Sim">
        <span class="checkmark"></span>
      </label>
      <label class="radio-label">Não
        <input type="radio" name="vehicle_damaged" value="Não">
        <span class="checkmark"></span>
      </label>
    </div>
      </div>
      <label for="observations">Observações:</label>
      <textarea id="observations" name="observations" rows="4"></textarea>

      <div style="display: flex; gap: 10px; margin-top: 25px;">
        <button type="submit">Salvar Saída</button>
        <button type="button" onclick="window.location.href='/'" style="background-color: #f44336;">Sair</button>
      </div>
    </form>
  </div>

  <script>
    function takePhoto(field, facingMode = 'environment') {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
        .then(function(stream) {
          const video = document.createElement('video');
          video.srcObject = stream;
          video.play();
          const canvas = document.createElement('canvas');
          canvas.width = 640;
          canvas.height = 480;
          const context = canvas.getContext('2d');
          video.addEventListener('loadedmetadata', function() {
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function(blob) {
              const file = new File([blob], `${field}_photo.jpg`, { type: 'image/jpeg' });
              const dataTransfer = new DataTransfer();
              dataTransfer.items.add(file);
              document.getElementById(`${field}_file`).files = dataTransfer.files;
              document.getElementById(`${field}_preview`).src = URL.createObjectURL(blob);
              document.getElementById(`${field}_preview`).style.display = 'block';
              stream.getTracks().forEach(track => track.stop());
            }, 'image/jpeg');
          });
        })
        .catch(function(err) {
          alert('Erro ao acessar câmera: ' + err.message);
        });
    }

    document.getElementById('initial_km_file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('initial_km_preview').src = URL.createObjectURL(file);
        document.getElementById('initial_km_preview').style.display = 'block';
      }
    });

    document.getElementById('initial_tank_file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('initial_tank_preview').src = URL.createObjectURL(file);
        document.getElementById('initial_tank_preview').style.display = 'block';
      }
    });

    document.getElementById('car_status_file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        document.getElementById('car_status_preview').src = URL.createObjectURL(file);
        document.getElementById('car_status_preview').style.display = 'block';
      }
    });

    // Set current date and time on page load
    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      const dateTimeString = now.toLocaleString('pt-BR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('departure_time').value = dateTimeString;
    });

    document.getElementById('initialForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      fetch('/submit_initial', {
        method: 'POST',
        body: formData,
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'ok') {
          alert('Salvo com sucesso!');
          // Redirect to login instead of resetting form
          window.location.href = '/';
        } else {
          alert('Erro ao salvar saída.');
        }
      });
    });
  </script>
</body>
</html>
