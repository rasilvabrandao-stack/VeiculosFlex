<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Carro - Saída</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 550px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
      margin: 20px auto;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 1.6rem;
      margin-bottom: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .photo-section {
      display: flex;
      flex-direction: column;
      margin-top: 10px;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .photo-buttons button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .photo-buttons button:hover {
      background-color: #0056b3;
    }

    .photo-preview {
      margin-top: 10px;
      max-width: 200px;
      max-height: 150px;
      border: 1px solid #ccc;
      display: none;
    }

    label {
      margin-top: 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    textarea {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      resize: vertical;
    }

    button {
      margin-top: 25px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    .alerta {
      font-weight: bold;
      margin-top: 25px;
      color: red;
      font-size: 0.95rem;
      text-align: center;
    }

    /* ===== MODAL PEQUENO ===== */
    #cameraModal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.65);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    #modalBox {
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #modalVideo {
      width: 260px;
      height: 200px;
      background: #000;
      border-radius: 6px;
    }

    #captureBtn {
      margin-top: 10px;
      padding: 10px;
      width: 260px;
      background: #28a745;
      color: white;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
      cursor: pointer;
    }

    #closeModal {
      margin-top: 8px;
      width: 260px;
      padding: 8px;
      background: #dc3545;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Controle de Carro - Saída</h1>
    <form id="initialForm" enctype="multipart/form-data" method="post">
      <input type="hidden" id="cpf" name="cpf" value="{{ cpf }}">

      <label for="requester_name">Nome do Autorizador:</label>
      <select id="Autorizador" name="requester_name">
        <Option> Selecione </Option>
        <Option> Iseli </Option>
        <Option> Elis </Option>
        <Option> Will </Option>
        <Option> William </Option>
        <Option> Ronaldo </Option>
        <Option> Gustavo </Option>
        <Option> Jesus </Option>
        <Option> Bruno </Option>
        <Option> Ivan </Option>
        <Option> Thiago Coelho </Option>
      </select>

      <label for="reason">Motivo:</label>
      <input type="text" id="reason" name="reason" required>

      <label for="driver_name">Nome do Motorista:</label>
      <input type="text" id="driver_name" name="driver_name" value="{{ driver_name }}" required>

      <label for="departure_time">Data e Horário de Saída:</label>
      <input type="text" id="departure_time" name="departure_time" readonly>

      <label for="initial_km">Km Inicial:</label>
      <input type="number" id="initial_km" name="initial_km" required>

      <label for="initial_tank_level">Autonomia do tanque de gasolina:</label>
      <input type="number" id="initial_tank_level" name="initial_tank_level" min="0" max="100" required>

      <!-- FOTO 1 -->
      <div class="photo-section">
        <label>Foto do Painel/Hodômetro:</label>

        <div class="photo-buttons">
          <button type="button" onclick="openCamera('initial_panel')">Tirar Foto</button>
          <input type="file" id="initial_panel_file" name="initial_panel_photo" accept="image/*" style="display: none;">
        </div>

        <img id="initial_panel_preview" class="photo-preview">
      </div>

      <label for="origin">Endereço de Origem:</label>
      <input type="text" id="origin" name="origin" required>

      <label for="car_status">Estado do Carro:</label>
      <input type="text" id="car_status" name="car_status" required>

      <label for="destination">Endereço de Destino:</label>
      <input type="text" id="destination" name="destination" required>

      <!-- FOTO 2 -->
      <div class="photo-section">
        <label>Foto do Estado do Carro:</label>

        <div class="photo-buttons">
          <button type="button" onclick="openCamera('initial_car')">Tirar Foto</button>
          <input type="file" id="initial_car_file" name="initial_car_photo" accept="image/*" style="display: none;">
        </div>

        <img id="initial_car_preview" class="photo-preview">
      </div>

      <label for="observations">Observações:</label>
      <textarea id="observations" name="observations" rows="4"></textarea>

      <div style="display: flex; gap: 10px; margin-top: 25px;">
        <button type="submit">Salvar Saída</button>
        <button type="button" onclick="window.location.href='/'" style="background-color: #f44336;">Sair</button>
      </div>

    </form>
  </div>

  <!-- MODAL DA CÂMERA -->
  <div id="cameraModal">
    <div id="modalBox">
      <video id="modalVideo" autoplay></video>
      <button id="captureBtn" onclick="capturePhoto()">Capturar</button>
      <button id="closeModal" onclick="closeModalCamera()">Cancelar</button>
    </div>
  </div>

<script>
let activeField = null;
let cameraStream = null;

async function openCamera(field) {
  activeField = field;

  document.getElementById("cameraModal").style.display = "flex";

  cameraStream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "environment",
      width: { ideal: 1920 },
      height: { ideal: 1080 }
    }
  });

  const video = document.getElementById("modalVideo");
  video.srcObject = cameraStream;
  video.play();
}

function closeModalCamera() {
  document.getElementById("cameraModal").style.display = "none";
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
}

function capturePhoto() {
  const video = document.getElementById("modalVideo");
  const canvas = document.createElement("canvas");

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video, 0, 0);

  canvas.toBlob(blob => {
    const file = new File([blob], `${activeField}.jpg`, { type: "image/jpeg" });

    const dt = new DataTransfer();
    dt.items.add(file);

    document.getElementById(`${activeField}_file`).files = dt.files;

    const preview = document.getElementById(`${activeField}_preview`);
    preview.src = URL.createObjectURL(blob);
    preview.style.display = "block";

    closeModalCamera();
  }, "image/jpeg", 0.9);
}

// Atualiza data/hora
document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  document.getElementById('departure_time').value = now.toLocaleString('pt-BR');
});

// Validar / enviar
document.getElementById('initialForm').addEventListener('submit', async e => {
  e.preventDefault();

  const submitBtn = e.target.querySelector('button[type="submit"]');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Enviando...';

  if (document.getElementById("Autorizador").value === "Selecione") {
    alert("Selecione um autorizador.");
    submitBtn.disabled = false;
    submitBtn.textContent = 'Salvar Saída';
    return;
  }

  if (!document.getElementById('initial_panel_file').files.length) {
    alert("Tire a foto do painel.");
    submitBtn.disabled = false;
    submitBtn.textContent = 'Salvar Saída';
    return;
  }

  if (!document.getElementById('initial_car_file').files.length) {
    alert("Tire a foto do carro.");
    submitBtn.disabled = false;
    submitBtn.textContent = 'Salvar Saída';
    return;
  }

  const formData = new FormData(e.target);

  try {
    const response = await fetch('/submit_initial', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (data.status === 'ok') {
      alert('Salvo com sucesso!');
      window.location.href = '/';
    } else {
      alert('Erro ao salvar.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Salvar Saída';
    }
  } catch (error) {
    alert('Erro de rede. Tente novamente.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Salvar Saída';
  }
});
</script>

</body>
</html>
