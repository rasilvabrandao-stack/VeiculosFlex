<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Controle de Carro - Inicial</title>
    <style>
        body {
          margin: 0;
          padding: 0;
          font-family: 'Segoe UI', sans-serif;
          /* gradiente azul-claro → azul-escuro */
          background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
          min-height: 100vh;   /* garante que o gradiente cubra toda a altura */
        }
        .container {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .meu-paragrafo {
          color: #000000;
          font-weight: bold;
          margin-top: 10px;
          margin-left: 35%;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Controle de Carro - Saída</h1>
        <form id="initialForm">
            <input type="hidden" id="cpf" name="cpf" value="{{ cpf }}">
            <label for="requester_name">Nome do Solicitante:</label>
            <input type="text" id="requester_name" name="requester_name" required>

            <label for="driver_name">Nome do Motorista:</label>
            <input type="text" id="driver_name" name="driver_name" value="{{ driver_name }}" required>

            <label for="date">Data:</label>
            <input type="date" id="date" name="date" required>

            <label for="initial_km">Km Inicial:</label>
            <input type="number" id="initial_km" name="initial_km" required>

            <label for="departure_time">Horário de Saída:</label>
            <input type="time" id="departure_time" name="departure_time" required>

            <label for="origin">Endereço de Origem:</label>
            <input type="text" id="origin" name="origin" required>

            <label for="initial_tank_level">Nível Inicial do Tanque (Litros):</label>
            <input type="number" id="initial_tank_level" name="initial_tank_level" min="0" max="100" required>

            <label for="destination">Endereço de Destino:</label>
            <input type="text" id="destination" name="destination" required>

            <button type="submit">Salvar Saída</button>
        </form>
        <p style="font-weight: bold; margin-top: 20px; color: red; font-size: 15px;">⚠ Mande foto do carro no momento de saída e chegada no número abaixo ⚠</p>
        <p class="meu-paragrafo">(11) 99999-9999</p>
    </div>

    <script>
        document.getElementById('initialForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            fetch('/submit_initial', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    alert('Saída salva com sucesso!');
                    e.target.reset();
                } else {
                    alert('Erro ao salvar saída.');
                }
            });
        });
    </script>
</body>
</html>
