<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Carro - Saída</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 550px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
      margin: 20px auto;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 1.6rem;
      margin-bottom: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .photo-section {
      display: flex;
      flex-direction: column;
      margin-top: 10px;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
      flex-wrap: wrap;
    }

    .photo-buttons button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .photo-buttons button:hover {
      background-color: #0056b3;
    }

    .photo-preview {
      margin-top: 10px;
      max-width: 200px;
      max-height: 150px;
      border: 1px solid #ccc;
      display: none;
    }

    label {
      margin-top: 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    textarea {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
      resize: vertical;
    }

    button {
      margin-top: 25px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    #Autorizador {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Controle de Carro - Saída</h1>
    <form id="initialForm" enctype="multipart/form-data" method="post">
      <input type="hidden" id="cpf" name="cpf" value="{{ cpf }}">

      <label for="requester_name">Nome do Autorizador:</label>
      <select id="Autorizador" name="requester_name">
        <Option> Selecione </Option>
        <Option> Iseli </Option>
        <Option> Elis </Option>
        <Option> Will </Option>
        <Option> William </Option>
        <Option> Ronaldo </Option>
        <Option> Gustavo </Option>
        <Option> Jesus </Option>
        <Option> Bruno </Option>
        <Option> Ivan </Option>
        <Option> Thiago Coelho </Option>
      </select>

      <label for="reason">Motivo:</label>
      <input type="text" id="reason" name="reason" required>

      <label for="driver_name">Nome do Motorista:</label>
      <input type="text" id="driver_name" name="driver_name" value="{{ driver_name }}" required>

      <label for="departure_time">Data e Horário de Saída:</label>
      <input type="text" id="departure_time" name="departure_time" readonly>

      <label for="initial_km">Km Inicial:</label>
      <input type="number" id="initial_km" name="initial_km" required>

      <label for="initial_tank_level">Autonomia do tanque de gasolina:</label>
      <input type="number" id="initial_tank_level" name="initial_tank_level" min="0" max="100" required>

      <div class="photo-section">
        <label>Foto do Painel/Hodômetro:</label>
        <div class="photo-buttons">
          <button type="button" onclick="takePhoto('initial_panel')">Tirar Foto</button>
          <input type="file" id="initial_panel_file" name="initial_panel_photo" accept="image/*" style="display: none;">
        </div>
        <img id="initial_panel_preview" class="photo-preview" alt="Preview">
      </div>

      <label for="origin">Endereço de Origem:</label>
      <input type="text" id="origin" name="origin" required>

      <label for="car_status">Estado do Carro:</label>
      <input type="text" id="car_status" name="car_status" required>

      <label for="destination">Endereço de Destino:</label>
      <input type="text" id="destination" name="destination" required>

      <div class="photo-section">
        <label>Foto do Estado do Carro:</label>
        <div class="photo-buttons">
          <button type="button" onclick="takePhoto('initial_car')">Tirar Foto</button>
          <input type="file" id="initial_car_file" name="initial_car_photo" accept="image/*" style="display: none;">
        </div>
        <img id="initial_car_preview" class="photo-preview" alt="Preview">
      </div>

      <label for="observations">Observações:</label>
      <textarea id="observations" name="observations" rows="4"></textarea>

      <div style="display: flex; gap: 10px; margin-top: 25px;">
        <button id="meuBotao" type="submit">Salvar Saída</button>
        <button type="button" onclick="window.location.href='/'" style="background-color: #f44336;">Sair</button>
      </div>
    </form>
  </div>
  
<script>
function takePhoto(field, facingMode = 'environment') {
  navigator.mediaDevices.getUserMedia({ video: { facingMode } })
    .then(stream => {
      const video = document.createElement('video');
      video.srcObject = stream;
      video.play();

      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');

      video.addEventListener('loadedmetadata', () => {
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
          const file = new File([blob], `${field}_photo.jpg`, { type: 'image/jpeg' });
          const dt = new DataTransfer();
          dt.items.add(file);

          document.getElementById(`${field}_file`).files = dt.files;
          document.getElementById(`${field}_preview`).src = URL.createObjectURL(blob);
          document.getElementById(`${field}_preview`).style.display = 'block';

          stream.getTracks().forEach(track => track.stop());
        }, 'image/jpeg');
      });
    })
    .catch(err => alert('Erro ao acessar câmera: ' + err.message));
}

document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  document.getElementById('departure_time').value = now.toLocaleString('pt-BR');
});

document.getElementById('initialForm').addEventListener('submit', async e => {
  e.preventDefault();

  const botao = document.getElementById("meuBotao");
  botao.disabled = true;
  botao.innerText = "Enviando...";

  const autorizador = document.getElementById('Autorizador').value;
  if (autorizador === "Selecione") {
    alert("Selecione um autorizador.");
    botao.disabled = false;
    botao.innerText = "Salvar Saída";
    return;
  }

  if (!document.getElementById('initial_panel_file').files.length) {
    alert("Tire a foto do painel.");
    botao.disabled = false;
    botao.innerText = "Salvar Saída";
    return;
  }

  if (!document.getElementById('initial_car_file').files.length) {
    alert("Tire uma foto do estado do carro.");
    botao.disabled = false;
    botao.innerText = "Salvar Saída";
    return;
  }

  const formData = new FormData(e.target);

  const response = await fetch('/submit_initial', {
    method: 'POST',
    body: formData
  });

  const data = await response.json();

  if (data.status === 'ok') {
    alert('Saída registrada com sucesso!');
    window.location.href = '/';
  } else {
    alert('Erro ao salvar.');
    botao.disabled = false;
    botao.innerText = "Salvar Saída";
  }
});
</script>
</body>
</html>
