<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Carro - Saída</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 550px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 1.6rem;
      margin-bottom: 15px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-top: 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    button {
      margin-top: 25px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    .alerta {
      font-weight: bold;
      margin-top: 25px;
      color: red;
      font-size: 0.95rem;
      text-align: center;
    }

    .meu-paragrafo {
      color: #000;
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
      margin-top: 5px;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .container {
        padding: 15px;
        border-radius: 10px;
      }

      h1 {
        font-size: 1.4rem;
      }

      label {
        font-size: 0.9rem;
      }

      input {
        font-size: 0.9rem;
        padding: 9px;
      }

      button {
        font-size: 0.95rem;
        padding: 10px;
      }
    }
/* Remove o estilo nativo dos inputs de data e hora */
input[type="date"],
input[type="time"] {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-color: white;
  color: #000;
}

/* Mantém o estilo igual aos outros inputs */
input[type="date"]:focus,
input[type="time"]:focus {
  outline: none;
  border-color: #4CAF50;
  box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
}

    
  </style>
</head>
<body>
  <div class="container">
    <h1>Controle de Carro - Saída</h1>
    <form id="initialForm">
      <input type="hidden" id="cpf" name="cpf" value="{{ cpf }}">

      <label for="requester_name">Nome do Solicitante:</label>
      <input type="text" id="requester_name" name="requester_name" required>

      <label for="driver_name">Nome do Motorista:</label>
      <input type="text" id="driver_name" name="driver_name" value="{{ driver_name }}" required>

      <label for="date">Data:</label>
      <input type="date" id="date" name="date" required>

      <label for="initial_km">Km Inicial:</label>
      <input type="number" id="initial_km" name="initial_km" required>

      <label for="departure_time">Horário de Saída:</label>
      <input type="time" id="departure_time" name="departure_time" required>

      <label for="origin">Endereço de Origem:</label>
      <input type="text" id="origin" name="origin" required>

      <label for="initial_tank_level">Nível Inicial do Tanque (Litros):</label>
      <input type="number" id="initial_tank_level" name="initial_tank_level" min="0" max="100" required>

      <label for="destination">Endereço de Destino:</label>
      <input type="text" id="destination" name="destination" required>

      <button type="submit">Salvar Saída</button>
    </form>

    <p class="alerta">⚠ Mande foto do carro no momento de saída e chegada no número abaixo ⚠</p>
    <p class="meu-paragrafo">(11) 97404-7741</p>
  </div>

  <script>
    document.getElementById('initialForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData);
      fetch('/submit_initial', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(data),
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'ok') {
          alert('Saída salva com sucesso!');
          e.target.reset();
        } else {
          alert('Erro ao salvar saída.');
        }
      });
    });
  </script>
</body>
</html>
