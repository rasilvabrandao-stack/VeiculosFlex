<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Carro - Final</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 1.6rem;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .photo-section {
      display: flex;
      flex-direction: column;
      margin-top: 10px;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .photo-buttons button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .photo-buttons button:hover {
      background-color: #0056b3;
    }

    .photo-preview {
      margin-top: 10px;
      max-width: 200px;
      max-height: 150px;
      border: 1px solid #ccc;
      display: none;
    }

    label {
      margin-top: 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    input[readonly] {
      background-color: #f9f9f9;
      color: #666;
    }

    button {
      margin-top: 25px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    .alerta {
      font-weight: bold;
      margin-top: 25px;
      color: red;
      font-size: 0.95rem;
      text-align: center;
    }

    .meu-paragrafo {
      color: #000;
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
      margin-top: 5px;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .container {
        padding: 15px;
        border-radius: 10px;
      }

      h1 {
        font-size: 1.4rem;
      }

      label {
        font-size: 0.9rem;
      }

      input {
        font-size: 0.9rem;
        padding: 9px;
      }

      button {
        font-size: 0.95rem;
        padding: 10px;
      }
    }

    /* Remove o estilo nativo dos inputs de data e hora */
input[type="date"],
input[type="time"] {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-color: white;
  color: #000;
}

/* Mantém o estilo igual aos outros inputs */
input[type="date"]:focus,
input[type="time"]:focus {
  outline: none;
  border-color: #4CAF50;
  box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Controle de Carro - Chegada</h1>
    <form id="finalForm" enctype="multipart/form-data">
      <input type="hidden" id="cpf" name="cpf" value="{{ cpf }}">

      <label for="final_km">Km Final:</label>
      <input type="number" id="final_km" name="final_km" required>

      <label for="final_tank_level">Nível Final do Tanque (%):</label>
      <input type="number" id="final_tank_level" name="final_tank_level" min="0" max="100" required>

      <label for="arrival_time">Data e Hora de Chegada:</label>
      <input type="text" id="arrival_time" name="arrival_time" readonly>

      <div class="photo-section">
        <label>Foto do Km Final:</label>
        <input type="file" id="final_km_file" name="final_km_photo" accept="image/*" style="display: none;">
        <div class="photo-buttons">
          <button type="button" onclick="takePhoto('final_km')">Tirar Foto</button>
        </div>
        <img id="final_km_preview" class="photo-preview" alt="Preview">
      </div>

      <div class="photo-section">
        <label>Foto do Nível Final do Tanque:</label>
        <input type="file" id="final_tank_file" name="final_tank_photo" accept="image/*" style="display: none;">
        <div class="photo-buttons">
          <button type="button" onclick="takePhoto('final_tank')">Tirar Foto</button>
        </div>
        <img id="final_tank_preview" class="photo-preview" alt="Preview">
      </div>

      <label for="observations">Observações:</label>
      <textarea id="observations" name="observations" rows="4"></textarea>

      <div class="radio-group">
        <p id="textodaora"><strong>Estado do veículo</strong></p>

        <div style="margin-bottom: 15px;">
          <strong>O Veículo está sujo?</strong><br>
          <label class="radio-label">Sim
            <input type="radio" name="vehicle_dirty" value="Sim">
            <span class="checkmark"></span>
          </label>
          <label class="radio-label">Não
            <input type="radio" name="vehicle_dirty" value="Não">
            <span class="checkmark"></span>
          </label>
        </div>

        <div style="margin-bottom: 15px;">
          <strong>Quebrou alguma peça?</strong><br>
          <label class="radio-label">Sim
            <input type="radio" name="vehicle_broken" value="Sim">
            <span class="checkmark"></span>
          </label>
          <label class="radio-label">Não
            <input type="radio" name="vehicle_broken" value="Não">
            <span class="checkmark"></span>
          </label>
        </div>

        <div style="margin-bottom: 15px;">
          <strong>Houve danificações?</strong><br>
          <label class="radio-label">Sim
            <input type="radio" name="vehicle_damaged" value="Sim">
            <span class="checkmark"></span>
          </label>
          <label class="radio-label">Não
            <input type="radio" name="vehicle_damaged" value="Não">
            <span class="checkmark"></span>
          </label>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 25px;">
        <button type="submit">Salvar Chegada</button>
        <button type="button" onclick="window.location.href='/'" style="background-color: #f44336;">Sair</button>
      </div>
    </form>
  </div>

  <script>
function takePhoto(field, facingMode = 'environment') {
  navigator.mediaDevices.getUserMedia({ video: { facingMode } })
    .then(stream => {
      const video = document.createElement('video');
      video.srcObject = stream;

      video.onloadeddata = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 640;
        canvas.height = 480;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
          const file = new File([blob], `${field}.jpg`, { type: 'image/jpeg' });
          const dt = new DataTransfer();
          dt.items.add(file);

          document.getElementById(`${field}_file`).files = dt.files;
          document.getElementById(`${field}_preview`).src = URL.createObjectURL(blob);
          document.getElementById(`${field}_preview`).style.display = 'block';

          stream.getTracks().forEach(t => t.stop());
        }, 'image/jpeg');
      };

      video.play();
    })
    .catch(err => alert("Erro ao acessar a câmera: " + err.message));
}

document.addEventListener('DOMContentLoaded', () => {
  const now = new Date();
  document.getElementById('arrival_time').value = now.toLocaleString('pt-BR');
});

document.getElementById('finalForm').addEventListener('submit', async e => {
  e.preventDefault();

  // validações
  if (!document.getElementById('final_km_file').files.length) {
    alert("Tire a foto do KM Final.");
    return;
  }
  if (!document.getElementById('final_tank_file').files.length) {
    alert("Tire a foto do Tanque Final.");
    return;
  }

  const formData = new FormData(e.target);

  const response = await fetch('/submit_final', {
    method: 'POST',
    body: formData
  });

  const data = await response.json();

  if (data.status === 'ok') {
    alert("Chegada registrada!");
    window.location.href = '/';
  } else {
    alert("Erro ao salvar chegada.");
  }
});
</script>
</body>
</html>
