<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Carro - Final</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 1.6rem;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .photo-section {
      display: flex;
      flex-direction: column;
      margin-top: 10px;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .photo-buttons button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .photo-buttons button:hover {
      background-color: #0056b3;
    }

    .photo-preview {
      margin-top: 10px;
      max-width: 200px;
      max-height: 150px;
      border: 1px solid #ccc;
      display: none;
    }

    label {
      margin-top: 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    input[readonly] {
      background-color: #f9f9f9;
      color: #666;
    }

    button {
      margin-top: 25px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    .alerta {
      font-weight: bold;
      margin-top: 25px;
      color: red;
      font-size: 0.95rem;
      text-align: center;
    }

    .meu-paragrafo {
      color: #000;
      font-weight: bold;
      text-align: center;
      font-size: 1rem;
      margin-top: 5px;
    }

    /* Responsividade */
    @media (max-width: 600px) {
      .container {
        padding: 15px;
        border-radius: 10px;
      }

      h1 {
        font-size: 1.4rem;
      }

      label {
        font-size: 0.9rem;
      }

      input {
        font-size: 0.9rem;
        padding: 9px;
      }

      button {
        font-size: 0.95rem;
        padding: 10px;
      }
    }

    /* Remove o estilo nativo dos inputs de data e hora */
input[type="date"],
input[type="time"] {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
  background-color: white;
  color: #000;
}

/* Mantém o estilo igual aos outros inputs */
input[type="date"]:focus,
input[type="time"]:focus {
  outline: none;
  border-color: #4CAF50;
  box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
}

    
  </style>
</head>
<body>
  <div class="container">
    <h1>Controle de Carro - Chegada</h1>
    <form id="finalForm" enctype="multipart/form-data">
      <input type="hidden" id="cpf" name="cpf" value="{{ cpf }}">

      <label for="final_km">Km Final:</label>
      <input type="number" id="final_km" name="final_km" required>

      <label for="arrival_time">Data e Hora de Chegada:</label>
      <input type="text" id="arrival_time" name="arrival_time" readonly>

      <div class="photo-section">
        <label>Foto do Km Final:</label>
        <div class="photo-buttons">
          <button type="button" onclick="takePhoto('final_km')">Tirar Foto</button>
        </div>
        <img id="final_km_preview" class="photo-preview" alt="Preview">
      </div>

      <div class="photo-section">
        <label>Foto do Nível Final do Tanque:</label>
        <div class="photo-buttons">
          <button type="button" onclick="takePhoto('final_tank')">Tirar Foto</button>
        </div>
        <img id="final_tank_preview" class="photo-preview" alt="Preview">
      </div>
       <label for="observations">Observações:</label>
      <textarea id="observations" name="observations" rows="4"></textarea>

      <div style="display: flex; gap: 10px; margin-top: 25px;">
        <button type="submit">Salvar Chegada</button>
        <button type="button" onclick="window.location.href='/'" style="background-color: #f44336;">Sair</button>
      </div>
    </form>

    <p class="alerta">⚠ Mande foto do carro no momento de saída e chegada no número abaixo ⚠</p>
    <p class="meu-paragrafo">(11) 97404-7741</p>
  </div>

  <script>
    function takePhoto(field, facingMode = 'environment') {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode } })
        .then(function(stream) {
          const video = document.createElement('video');
          video.srcObject = stream;
          video.play();
          const canvas = document.createElement('canvas');
          canvas.width = 640;
          canvas.height = 480;
          const context = canvas.getContext('2d');
          video.addEventListener('loadedmetadata', function() {
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function(blob) {
              const file = new File([blob], `${field}_photo.jpg`, { type: 'image/jpeg' });
              const dataTransfer = new DataTransfer();
              dataTransfer.items.add(file);
              document.getElementById(`${field}_file`).files = dataTransfer.files;
              document.getElementById(`${field}_preview`).src = URL.createObjectURL(blob);
              document.getElementById(`${field}_preview`).style.display = 'block';
              stream.getTracks().forEach(track => track.stop());
            }, 'image/jpeg');
          });
        })
        .catch(function(err) {
          alert('Erro ao acessar câmera: ' + err.message);
        });
    }



    // Set current date and time on page load
    document.addEventListener('DOMContentLoaded', function() {
      const now = new Date();
      const dateTimeString = now.toLocaleString('pt-BR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
      document.getElementById('arrival_time').value = dateTimeString;
    });

    document.getElementById('finalForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      fetch('/submit_final', {
        method: 'POST',
        body: formData,
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'ok') {
          alert('Chegada salva com sucesso!');
          e.target.reset();
          // Hide previews
          document.querySelectorAll('.photo-preview').forEach(img => img.style.display = 'none');
        } else {
          alert('Erro ao salvar chegada.');
        }
      });
    });
  </script>
</body>
</html>
