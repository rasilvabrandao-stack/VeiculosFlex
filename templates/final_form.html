<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Carro - Final</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
      font-size: 1.6rem;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    .photo-section {
      display: flex;
      flex-direction: column;
      margin-top: 10px;
    }

    .photo-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .photo-buttons button {
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .photo-preview {
      margin-top: 10px;
      max-width: 200px;
      max-height: 150px;
      border: 1px solid #ccc;
      display: none;
    }

    label {
      margin-top: 12px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input {
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 0.95rem;
    }

    input[readonly] {
      background-color: #f9f9f9;
      color: #666;
    }

    button {
      margin-top: 25px;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.3s;
    }

    /* MODAL DE CÂMERA */
    #cameraModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #cameraBox {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      width: 320px;
    }

    #cameraPreview {
      width: 100%;
      border-radius: 10px;
      background: black;
      object-fit: cover;
    }

    #cameraButtons {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
    }

    #cameraButtons button {
      flex: 1;
      margin: 5px;
      padding: 10px;
      font-size: 0.9rem;
    }

  </style>
</head>

<body>
  <div class="container">
    <h1>Controle de Carro - Chegada</h1>

    <form id="finalForm" enctype="multipart/form-data">
      <input type="hidden" id="cpf" name="cpf" value="{{ cpf }}">

      <label for="final_km">Km Final:</label>
      <input type="number" id="final_km" name="final_km" required>

      <label for="final_tank_level">Nível Final do Tanque (%):</label>
      <input type="number" id="final_tank_level" name="final_tank_level" min="0" max="100" required>

      <label for="arrival_time">Data e Hora de Chegada:</label>
      <input type="text" id="arrival_time" name="arrival_time" readonly>

      <!-- FOTO KM FINAL -->
      <div class="photo-section">
        <label>Foto do Km Final:</label>
        <input type="file" id="final_km_file" name="final_km_photo" accept="image/*" style="display: none;">
        <div class="photo-buttons">
          <button type="button" onclick="openCamera('final_km')">Tirar Foto</button>
        </div>
        <img id="final_km_preview" class="photo-preview" alt="Preview">
      </div>

      <!-- FOTO TANQUE FINAL -->
      <div class="photo-section">
        <label>Foto do Nível Final do Tanque:</label>
        <input type="file" id="final_tank_file" name="final_tank_photo" accept="image/*" style="display: none;">
        <div class="photo-buttons">
          <button type="button" onclick="openCamera('final_tank')">Tirar Foto</button>
        </div>
        <img id="final_tank_preview" class="photo-preview" alt="Preview">
      </div>

      <label for="observations">Observações:</label>
      <textarea id="observations" name="observations" rows="4"></textarea>

      <div style="display: flex; gap: 10px; margin-top: 25px;">
        <button type="submit">Salvar Chegada</button>
        <button type="button" onclick="window.location.href='/'" style="background-color: #f44336;">Sair</button>
      </div>
    </form>
  </div>

  <!-- MODAL DE CÂMERA -->
  <div id="cameraModal">
    <div id="cameraBox">
      <video id="cameraPreview" autoplay playsinline></video>

      <div id="cameraButtons">
        <button onclick="capturePhoto()">Capturar</button>
        <button onclick="closeCamera()" style="background:#cc0000;">Fechar</button>
      </div>
    </div>
  </div>

<script>
let currentField = "";
let currentStream = null;

async function openCamera(field) {
  currentField = field;

  document.getElementById("cameraModal").style.display = "flex";

  // Ultra qualidade
  const constraints = {
    video: {
      facingMode: "environment",
      width: { ideal: 1920 },
      height: { ideal: 1080 },
      frameRate: { ideal: 30 },
      noiseSuppression: true,
      advanced: [
        { focusMode: "continuous" },
        { exposureMode: "continuous" },
        { whiteBalanceMode: "continuous" }
      ]
    }
  };

  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    currentStream = stream;

    const video = document.getElementById("cameraPreview");
    video.srcObject = stream;

    await new Promise(r => setTimeout(r, 350)); // ajuda foco inicial

  } catch (err) {
    alert("Erro ao acessar a câmera: " + err.message);
    closeCamera();
  }
}

function closeCamera() {
  document.getElementById("cameraModal").style.display = "none";

  if (currentStream) {
    currentStream.getTracks().forEach(t => t.stop());
    currentStream = null;
  }
}

function capturePhoto() {
  const video = document.getElementById("cameraPreview");

  const canvas = document.createElement("canvas");
  canvas.width = 1920;
  canvas.height = 1080;

  const ctx = canvas.getContext("2d");

  ctx.filter = "contrast(1.05) brightness(1.02) saturate(1.08)";
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  canvas.toBlob(blob => {
    const file = new File([blob], `${currentField}.jpg`, { type: "image/jpeg" });

    const dt = new DataTransfer();
    dt.items.add(file);

    document.getElementById(`${currentField}_file`).files = dt.files;

    const preview = document.getElementById(`${currentField}_preview`);
    preview.src = URL.createObjectURL(blob);
    preview.style.display = "block";

    closeCamera();
  }, "image/jpeg", 0.95);
}

document.addEventListener("DOMContentLoaded", () => {
  const now = new Date();
  document.getElementById("arrival_time").value = now.toLocaleString("pt-BR");
});
</script>

</body>
</html>
