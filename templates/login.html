<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Controle de Carro</title>
    <style>
        /* static/style.css */
        body {
          margin: 0;
          padding: 0;
          font-family: 'Segoe UI', sans-serif;
          /* gradiente azul-claro → azul-escuro */
          background: linear-gradient(100deg, #b001a8 0%, #0277b7 100%);
          min-height: 100vh;   /* garante que o gradiente cubra toda a altura */
        }

        .logo {
            display: block;
            margin: 0 auto 20px auto;
            max-width: 200px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<img src="{{ url_for('static', filename='fleximedical_kure.png') }}" alt="Logo FlexiMedical" class="logo">



    <div class="container">
        <h1>Login - Controle de Carro</h1>
        <form id="loginForm">
            <label for="driver_name">Nome do Motorista:</label>
            <input type="text" id="driver_name" name="driver_name" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required>

            <button type="submit">Entrar</button>
            <h3></h3>
            <div class="container">
        </form>
        <a href="/admin_login">Área Admin</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            fetch('/submit_login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
            })
            .then(response => response.json())
            .then(data => {
                if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    alert('Erro no login.');
                }
            });
        });
    </script>
</body>
</html>
