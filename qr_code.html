<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code - Acesso ao Sistema</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .qr-code {
            margin: 20px 0;
        }
        .instructions {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR Code para Acesso ao Sistema</h1>
        <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://veiculosfleximedical-kure.onrender.com" alt="QR Code" />
        </div>
        <div class="instructions">
            <p>Escaneie o QR Code acima com seu dispositivo móvel para acessar o sistema de controle de veículos.</p>
            <p>Ou acesse diretamente: <a href="https://veiculosfleximedical-kure.onrender.com">https://veiculosfleximedical-kure.onrender.com</a></p>
        </div>
    </div>
</body>
</html>
